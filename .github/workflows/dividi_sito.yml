name: Ripristina JS e Pulisci Lezioni

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ripara script.js e verifica sintassi
        run: |
          cat << 'EOF' > repair.py
          with open("script.js", "r", encoding="utf-8") as f:
              js = f.read()

          # Taglia da function showView in poi e riscrive la parte finale in modo pulito e valido
          idx = js.find("function showView(")
          if idx != -1:
              js = js[:idx].rstrip() + """

          function showView(viewId) {
            const viewProg = document.getElementById('viewProgramma');
            const viewMega = document.getElementById('viewMegaAree');
            if (viewProg) viewProg.classList.remove('active');
            if (viewMega) viewMega.classList.remove('active');

            document.querySelectorAll('.view-screen').forEach(el => {
              el.classList.add('hidden');
              el.classList.remove('flex');
            });
            const target = document.getElementById(viewId);
            if (target) {
              target.classList.remove('hidden');
              target.classList.add('flex');
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }

          function showHome() {
            showView('view-home');
          }
          """

          with open("script.js", "w", encoding="utf-8") as f:
              f.write(js)

          print("script.js riparato con successo!")
          EOF
          python repair.py
          rm repair.py
          node --check script.js

      - name: Salva su GitHub
        run: |
          git config user.name "Historia Chronos Bot"
          git config user.email "bot@historiachronos.local"
          git add script.js
          git commit -m "Fix sintassi JavaScript e sblocco pulsanti"
          git push
