name: Aggiungi Analytics e SEO

on:
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inserisci Cloudflare Web Analytics in tutte le pagine
        run: |
          cat << 'EOF' > add_analytics.py
          import glob

          snippet = """<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b58b7e4bc1f94744a6c07990317482ba"}'></script><!-- End Cloudflare Web Analytics -->"""

          files = ["index.html"] + glob.glob("lezioni/*.html")
          count = 0

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  html = f.read()

              if "b58b7e4bc1f94744a6c07990317482ba" not in html and "</body>" in html:
                  html = html.replace("</body>", f"{snippet}\n</body>")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(html)
                  count += 1

          print(f"Cloudflare Web Analytics aggiunto a {count} pagine!")
          EOF
          python add_analytics.py
          rm add_analytics.py

      - name: Salva su GitHub
        run: |
          git config user.name "Historia Chronos Bot"
          git config user.email "bot@historiachronos.local"
          git add .
          git commit -m "Attivato Cloudflare Web Analytics su home e lezioni"
          git push
