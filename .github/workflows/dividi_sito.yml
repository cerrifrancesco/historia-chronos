name: Genera Atlante JS
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unisci dati nazioni e logica monete in atlante.js
        run: |
          python3 -c '
          with open("_materiale_agente/2_dati_nazioni.js", "r", encoding="utf-8") as f:
              part1 = f.read()
          with open("_materiale_agente/3_logica_monete.js", "r", encoding="utf-8") as f:
              part2 = f.read()

          # Pulisce eventuali tag <script> o </body> residui dai due file
          for tag in ["<script>", "</script>", "</body>", "</html>"]:
              part1 = part1.replace(tag, "")
              part2 = part2.replace(tag, "")

          with open("atlante.js", "w", encoding="utf-8") as out:
              out.write(part1.strip() + "\n\n" + part2.strip() + "\n")
          '
      - name: Commit atlante.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atlante.js
          git commit -m "Creato atlante.js da 2_dati_nazioni e 3_logica_monete" || exit 0
          git push
