name: Unisci Index e Atlante

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unisci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui unione file HTML
        run: |
          python - << 'EOF'
          import re

          with open("index.html", "r", encoding="utf-8") as f:
              idx = f.read()

          with open("atlante.html", "r", encoding="utf-8") as f:
              atl = f.read()

          match_main = re.search(
              r'<main[^>]*id="atlante-content"[^>]*>(.*?)</main>', atl, re.DOTALL
          )
          if not match_main:
              raise ValueError("Impossibile trovare <main id='atlante-content'> in atlante.html")
          atlante_inner_html = match_main.group(1).strip()

          head_injection = """  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
            <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
            <link href="atlante.css" rel="stylesheet"/>
          </head>"""
          idx = idx.replace("</head>", head_injection, 1)

          old_atlante_btn_pattern = r'<a[^>]*href="atlante\.html"[^>]*>.*?</a>'
          new_atlante_btn = """<button class="path-btn" id="btnAtlante">
          <span class="btn-icon">🌍</span> Atlante &amp; Monete
                </button>"""
          idx = re.sub(old_atlante_btn_pattern, new_atlante_btn, idx, count=1, flags=re.DOTALL)

          view_atlante_block = f"""
          <!-- VIEW 3: ATLANTE & MONETE -->
          <section class="content-view" id="viewAtlante">
            <div id="atlante-content">
          {atlante_inner_html}
            </div>
          </section>
          <!-- TUTOR AI (SEMPRE VISIBILE IN FONDO) -->"""

          if "<!-- TUTOR AI (SEMPRE VISIBILE IN FONDO) -->" in idx:
              idx = idx.replace("<!-- TUTOR AI (SEMPRE VISIBILE IN FONDO) -->", view_atlante_block, 1)
          else:
              idx = idx.replace('<section class="ai-tutor-section"', view_atlante_block + '\n<section class="ai-tutor-section"', 1)

          scripts_injection = """<script src="atlante.js"></script>
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              const btnProgramma = document.getElementById("btnProgramma");
              const btnMegaAree = document.getElementById("btnMegaAree");
              const btnAtlante = document.getElementById("btnAtlante");

              const viewProgramma = document.getElementById("viewProgramma");
              const viewMegaAree = document.getElementById("viewMegaAree");
              const viewAtlante = document.getElementById("viewAtlante");

              function activateAtlanteView() {
                if (btnProgramma) btnProgramma.classList.remove("active");
                if (btnMegaAree) btnMegaAree.classList.remove("active");
                if (btnAtlante) btnAtlante.classList.add("active");

                if (viewProgramma) viewProgramma.classList.remove("active");
                if (viewMegaAree) viewMegaAree.classList.remove("active");
                if (viewAtlante) viewAtlante.classList.add("active");

                window.dispatchEvent(new Event("resize"));
              }

              if (btnAtlante) {
                btnAtlante.addEventListener("click", activateAtlanteView);
              }

              [btnProgramma, btnMegaAree].forEach(btn => {
                if (btn) {
                  btn.addEventListener("click", function () {
                    if (btnAtlante) btnAtlante.classList.remove("active");
                    if (viewAtlante) viewAtlante.classList.remove("active");
                  });
                }
              });

              const params = new URLSearchParams(window.location.search);
              if (params.get("tab") === "atlante") {
                activateAtlanteView();
              }
            });
          </script>
          </body>"""

          idx = idx.replace("</body>", scripts_injection, 1)

          with open("index_unito.html", "w", encoding="utf-8") as f:
              f.write(idx)
          print("Generato index_unito.html!")
          EOF

      - name: Salva modifiche nel repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index_unito.html
          git commit -m "Generato index_unito.html" || echo "Nessuna modifica"
          git push
