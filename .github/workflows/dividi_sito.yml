name: Verifica Google Search Console

on:
  workflow_dispatch:

jobs:
  google-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Aggiungi meta-tag Google a index.html
        run: |
          cat << 'EOF' > add_meta.py
          meta_tag = '<meta name="google-site-verification" content="Riyzn5lgqR5eow9Ya-qod1_b-sGdqQlLwo_6ZfkKkvA" />'

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          if "Riyzn5lgqR5eow9Ya-qod1_b-sGdqQlLwo_6ZfkKkvA" not in html and "</head>" in html:
              html = html.replace("</head>", f"  {meta_tag}\n</head>")
              with open("index.html", "w", encoding="utf-8") as f:
                  f.write(html)
              print("Meta-tag Google inserito con successo!")
          else:
              print("Meta-tag già presente.")
          EOF
          python add_meta.py
          rm add_meta.py

      - name: Salva su GitHub
        run: |
          git config user.name "Historia Chronos Bot"
          git config user.email "bot@historiachronos.local"
          git add index.html
          git commit -m "Aggiunto meta-tag Google Search Console"
          git push
